<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reminders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Shown when nobody is logged in -->
  <section id="auth-view" class="auth hidden">
    <div class="auth-card">
      <h1 class="wordmark">Reminders</h1>
      <p class="tagline">Everything you keep meaning to do.</p>

      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required />

        <button type="submit" id="submit-btn" class="btn-primary btn-block">Log in</button>
      </form>

      <p id="auth-message" class="message"></p>

      <p class="switch">
        <span id="switch-prompt">Need an account?</span>
        <button type="button" id="switch-btn" class="btn-text">Sign up</button>
      </p>
    </div>
  </section>

  <!-- Shown when logged in -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="wordmark wordmark-sm">Reminders</span>
        <div class="topbar-right">
          <span id="user-email" class="user-chip"></span>
          <button type="button" id="logout-btn" class="btn-text">Log out</button>
        </div>
      </div>
    </header>

    <main class="app">
      <div class="headline">
        <div>
          <h1 id="headline-count">Your reminders</h1>
          <p id="headline-sub" class="sub"></p>
        </div>
        <div class="viewswitch" role="tablist" aria-label="View">
          <button type="button" class="view" role="tab" data-view="list" aria-selected="true">List</button>
          <button type="button" class="view" role="tab" data-view="calendar" aria-selected="false">Calendar</button>
        </div>
      </div>

      <form id="reminder-form" class="composer">
        <input id="reminder-text" type="text" placeholder="What needs doing?"
               autocomplete="off" required />
        <div class="composer-row">
          <input id="reminder-due" type="date" aria-label="Due date" />
          <button type="submit" class="btn-primary">Add</button>
        </div>
      </form>

      <p id="app-message" class="message"></p>

      <!-- role="tablist" tells screen readers these behave as tabs, not links. -->
      <div class="tabs" role="tablist" aria-label="Filter reminders">
        <button type="button" class="tab" role="tab" data-filter="todo" aria-selected="true">
          To do <span class="tab-count" id="count-todo"></span>
        </button>
        <button type="button" class="tab" role="tab" data-filter="done" aria-selected="false">
          Done <span class="tab-count" id="count-done"></span>
        </button>
        <button type="button" class="tab" role="tab" data-filter="all" aria-selected="false">
          All <span class="tab-count" id="count-all"></span>
        </button>
      </div>

      <ul id="reminder-list" class="list"></ul>

      <div id="empty-state" class="empty hidden">
        <p class="empty-title">Nothing here yet</p>
        <p class="empty-sub">Add your first reminder above.</p>
      </div>

      <section id="calendar-view" class="hidden">
        <div class="cal-head">
          <button type="button" id="cal-prev" class="cal-nav" aria-label="Previous month">&#8249;</button>
          <h2 id="cal-title" class="cal-title"></h2>
          <button type="button" id="cal-next" class="cal-nav" aria-label="Next month">&#8250;</button>
          <button type="button" id="cal-today" class="btn-text cal-today">Today</button>
        </div>

        <div class="cal-weekdays" aria-hidden="true">
          <span>Mon</span><span>Tue</span><span>Wed</span>
          <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>

        <div id="cal-grid" class="cal-grid"></div>

        <div id="cal-undated" class="cal-undated hidden">
          <h3 class="cal-undated-title">No due date</h3>
          <ul id="cal-undated-list" class="list"></ul>
        </div>
      </section>
    </main>
  </div>

  <!-- Supabase JS client, loaded from their CDN. Exposes a global `supabase` object. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
