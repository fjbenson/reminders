<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reminders</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Shown when nobody is logged in -->
  <section id="auth-view" class="auth hidden">
    <div class="auth-card">
      <h1 class="wordmark">Reminders</h1>
      <p class="tagline">Everything you keep meaning to do.</p>

      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required />

        <button type="submit" id="submit-btn" class="btn-primary btn-block">Log in</button>
      </form>

      <p id="auth-message" class="message"></p>

      <p class="switch">
        <span id="switch-prompt">Need an account?</span>
        <button type="button" id="switch-btn" class="btn-text">Sign up</button>
      </p>
    </div>
  </section>

  <!-- Shown when logged in -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="wordmark wordmark-sm">Reminders</span>
        <div class="topbar-right">
          <span id="user-email" class="user-chip"></span>
          <button type="button" id="logout-btn" class="btn-text">Log out</button>
        </div>
      </div>
    </header>

    <main class="app">
      <div class="headline">
        <h1 id="headline-count">Your reminders</h1>
        <p id="headline-sub" class="sub"></p>
      </div>

      <form id="reminder-form" class="composer">
        <input id="reminder-text" type="text" placeholder="What needs doing?"
               autocomplete="off" required />
        <div class="composer-row">
          <input id="reminder-due" type="date" aria-label="Due date" />
          <button type="submit" class="btn-primary">Add</button>
        </div>
      </form>

      <p id="app-message" class="message"></p>

      <ul id="reminder-list" class="list"></ul>

      <div id="empty-state" class="empty hidden">
        <p class="empty-title">Nothing here yet</p>
        <p class="empty-sub">Add your first reminder above.</p>
      </div>
    </main>
  </div>

  <!-- Supabase JS client, loaded from their CDN. Exposes a global `supabase` object. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
